name: Desktop installer

on:
  push:
    branches: [desktop]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run verify

      - run: npm run desktop:build

      - name: Checksum
        shell: bash
        working-directory: desktop/release
        run: |
          for file in *.exe; do
            echo "$(sha256sum "$file" | cut -d ' ' -f 1)  $file"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '**SHA-256**'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo 'Check your download in PowerShell with `Get-FileHash .\<file>.exe` and compare the hash.'
          } > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: wermymoolah-windows
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          body_path: desktop/release/release-notes.md
          generate_release_notes: true
